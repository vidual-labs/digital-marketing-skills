 .bubble{fill:#e6edf3}.bubbletxt{fill:#0d1117}
}

.anim{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.dot{animation-name:dot;animation-timing-function:linear}
@keyframes dot{0%{transform:translateX(0);opacity:0}3%{opacity:1}88%{transform:translateX(720px);opacity:1}94%,100%{transform:translateX(720px);opacity:0}}
.flow{stroke-dasharray:4 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.h0{animation-name:h0}@keyframes h0{0%,0.0%{opacity:0}2.0%,28.0%{opacity:1}34.0%,100%{opacity:0}}
.h1{animation-name:h1}@keyframes h1{0%,18.0%{opacity:0}24.0%,50.0%{opacity:1}56.0%,100%{opacity:0}}
